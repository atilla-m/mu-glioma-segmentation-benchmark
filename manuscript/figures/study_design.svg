<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#506477"/></marker></defs><rect width="1400" height="820" fill="#ffffff"/><text x="700" y="48" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#17365d">Nested patient-grouped evaluation</text><text x="700" y="82" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#59636e">All longitudinal timepoints from one patient remain together</text><rect x="70" y="125" width="260" height="130" rx="18" fill="#eaf2f8" stroke="#17365d" stroke-width="3"/><text x="200" y="166" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">Eligible dataset</text><text x="200" y="202" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#17202a">203 patients</text><text x="200" y="234" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#17202a">594 labeled scans</text><path d="M 330 190 L 420 190" fill="none" stroke="#506477" stroke-width="4" marker-end="url(#arrowhead)"/><rect x="420" y="120" width="300" height="140" rx="18" fill="#eef1f4" stroke="#17365d" stroke-width="3"/><text x="570" y="160" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">Five outer rotations</text><text x="570" y="197" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17202a">Patient grouped</text><text x="570" y="229" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17202a">Frozen seed 2026</text><path d="M 720 160 L 820 160" fill="none" stroke="#506477" stroke-width="4" marker-end="url(#arrowhead)"/><path d="M 720 220 L 820 405" fill="none" stroke="#506477" stroke-width="4" marker-end="url(#arrowhead)"/><rect x="820" y="105" width="480" height="145" rx="18" fill="#fff4e5" stroke="#a65f00" stroke-width="3"/><text x="1060" y="145" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#7a4300">Locked outer-test fold</text><text x="1060" y="183" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17202a">40–41 patients; 118–119 scans</text><text x="1060" y="218" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#9b1c31">Never used for optimization</text><rect x="820" y="330" width="480" height="150" rx="18" fill="#edf7f2" stroke="#2d7d5e" stroke-width="3"/><text x="1060" y="371" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#245f49">Outer-training remainder</text><text x="1060" y="410" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17202a">162–163 patients; 475–476 scans</text><text x="1060" y="446" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17202a">Split again by patient</text><path d="M 940 480 L 940 510 L 815 510 L 815 540" fill="none" stroke="#506477" stroke-width="4" marker-end="url(#arrowhead)"/><path d="M 1180 480 L 1180 540" fill="none" stroke="#506477" stroke-width="4" marker-end="url(#arrowhead)"/><rect x="650" y="540" width="330" height="130" rx="18" fill="#eaf2f8" stroke="#17365d" stroke-width="3"/><text x="815" y="580" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#17202a">Fit partition</text><text x="815" y="617" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17202a">130 patients</text><text x="815" y="650" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17202a">379–381 scans</text><rect x="1030" y="540" width="300" height="130" rx="18" fill="#f3eef8" stroke="#67408b" stroke-width="3"/><text x="1180" y="580" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#553274">Inner tuning</text><text x="1180" y="617" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17202a">32–33 patients</text><text x="1180" y="650" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17202a">94–96 scans</text><rect x="420" y="540" width="180" height="130" rx="18" fill="#edf7f2" stroke="#2d7d5e" stroke-width="3"/><text x="510" y="579" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#245f49">Train</text><text x="510" y="615" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17202a">5 models</text><text x="510" y="647" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17202a">per fold</text><path d="M 650 605 L 600 605" fill="none" stroke="#506477" stroke-width="4" marker-end="url(#arrowhead)"/><rect x="70" y="535" width="280" height="140" rx="18" fill="#f3eef8" stroke="#67408b" stroke-width="3"/><text x="210" y="575" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#553274">Select checkpoint</text><text x="210" y="612" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#17202a">Inner tuning only</text><text x="210" y="646" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#17202a">Prespecified stopping</text><path d="M 420 605 L 350 605" fill="none" stroke="#506477" stroke-width="4" marker-end="url(#arrowhead)"/><path d="M 1030 605 L 1000 605 L 1000 510 L 210 510 L 210 535" fill="none" stroke="#506477" stroke-width="4" marker-end="url(#arrowhead)"/><path d="M 210 675 L 210 690 L 570 690 L 570 708" fill="none" stroke="#506477" stroke-width="4" marker-end="url(#arrowhead)"/><path d="M 1300 177 L 1360 177 L 1360 690 L 1190 690 L 1190 708" fill="none" stroke="#506477" stroke-width="4" marker-end="url(#arrowhead)"/><rect x="420" y="708" width="880" height="92" rx="14" fill="#17365d" stroke="#17365d" stroke-width="3"/><text x="860" y="744" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Selected checkpoint + locked outer fold</text><text x="860" y="778" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">One-time full-volume inference → validated ZIP → patient-level analysis</text></svg>